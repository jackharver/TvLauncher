plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.alejandro.tvlauncher'
    compileSdk 34
    defaultConfig { applicationId 'com.alejandro.tvlauncher'; minSdk 26; targetSdk 33; versionCode 2; versionName '2.0' }
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
